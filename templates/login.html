<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <!-- 复用注册页面的样式 -->
    <link rel="stylesheet" href="/static/css/register.css">
    <style></style>
</head>
<body>

    <div class="container">
        <h1>登录</h1>
        <p class="extra-link">还未注册？<a href="/register">注册</a></p>

        <form id="loginForm" novalidate>
            <!-- 学号或教师号 -->
            <div class="form-group">
                <label for="username">学号或教师号 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="请输入学号或教师号" required>
                </div>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="password">密码 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <!-- 自定义密码切换按钮 -->
                    <button type="button" class="toggle-pwd" id="togglePwd" aria-label="切换密码可见性">
                        <svg class="icon icon-hidden" viewBox="0 0 1024 1024" width="24" height="24">
                            <path d="M512 256a416.853333 416.853333 0 0 1 376.32 234.666667 411.605333 411.605333 0 0 1-102.826667 133.12l60.16 60.16c59.306667-52.48 106.24-118.186667 135.68-193.28C907.52 303.36 725.333333 170.666667 512 170.666667c-54.186667 0-106.24 8.533333-155.306667 24.32l70.4 70.4C454.826667 259.84 482.986667 256 512 256z m-45.653333 48.64L554.666667 392.96c24.32 10.666667 43.946667 30.293333 54.613333 54.613333l88.32 88.32c3.413333-14.506667 5.973333-29.866667 5.973333-45.653333C704 384.426667 617.813333 298.666667 512 298.666667c-15.786667 0-30.72 2.133333-45.653333 5.973333zM85.76 165.12l114.346667 114.346667A500.821333 500.821333 0 0 0 42.666667 490.666667C116.48 677.973333 298.666667 810.666667 512 810.666667c64.853333 0 127.146667-12.373333 184.32-34.986667l145.92 145.92 60.16-60.16L145.92 104.533333 85.76 165.12z m320 320l111.36 111.36c-1.706667 0.426667-3.413333 0.853333-5.12 0.853333a106.666667 106.666667 0 0 1-106.666667-106.666666c0-2.133333 0.426667-3.413333 0.426667-5.546667z m-145.066667-145.066667l74.666667 74.666667a196.266667 196.266667 0 0 0-15.36 75.946667 192.298667 192.298667 0 0 0 267.52 176.64l41.813333 41.813333c-37.546667 10.24-76.8 16.213333-117.333333 16.213333a416.853333 416.853333 0 0 1-376.32-234.666666c29.866667-61.013333 73.386667-111.36 125.013333-150.613334z" />
                        </svg>
                        <svg class="icon icon-visible" viewBox="0 0 1024 1024" width="24" height="24" style="display:none;">
                            <path d="M512 256a416.853333 416.853333 0 0 1 376.32 234.666667C817.92 634.453333 673.706667 725.333333 512 725.333333s-305.92-90.88-376.32-234.666666A416.853333 416.853333 0 0 1 512 256m0-85.333333C298.666667 170.666667 116.48 303.36 42.666667 490.666667 116.48 677.973333 298.666667 810.666667 512 810.666667s395.52-132.693333 469.333333-320C907.52 303.36 725.333333 170.666667 512 170.666667z m0 213.333333a106.666667 106.666667 0 0 1 0 213.333333 106.666667 106.666667 0 0 1 0-213.333333m0-85.333333c-105.813333 0-192 86.186667-192 192S406.186667 682.666667 512 682.666667s192-86.186667 192-192S617.813333 298.666667 512 298.666667z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn">登录</button>
        </form>
    </div>

    <!-- Toast 提示（与注册页共用） -->
    <div class="toast" id="toast"></div>

    <script src="/static/js/login.js"></script>
</body>
</html>
