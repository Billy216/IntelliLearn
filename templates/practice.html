                    </div>

            <div class="content">
                <div class="pr-head">
                    <h2>个性化练习与复习卷</h2>
                    <p>按你的错题与薄弱知识点组卷 · 服务端判分 · 提交后可回顾解析并把错题加入错题本</p>
                </div>

                <!-- 组卷筛选 -->
                <div class="pr-toolbar">
                    <div class="pr-field">
                        <label class="pr-label" for="prMajor">学科</label>
                        <select id="prMajor" class="pr-select">
                            <option value="">全部学科</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prKp">知识点</label>
                        <select id="prKp" class="pr-select">
                            <option value="">全部知识点</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prQtype">题型</label>
                        <select id="prQtype" class="pr-select">
                            <option value="">不限题型</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prDifficulty">难度</label>
                        <select id="prDifficulty" class="pr-select">
                            <option value="">不限难度</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prErrorType">错误类型</label>
                        <select id="prErrorType" class="pr-select">
                            <option value="">不限错误类型</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prMastery">掌握度</label>
                        <select id="prMastery" class="pr-select">
                            <option value="">不限掌握度</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prCourse">课程</label>
                        <select id="prCourse" class="pr-select">
                            <option value="">不限课程</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prSource">组卷方式</label>
                        <select id="prSource" class="pr-select">
                            <option value="auto">错题优先（题库补充）</option>
                            <option value="wrong">只用我的错题</option>
                            <option value="bank">只用共享题库</option>
                        </select>
                    </div>
                    <div class="pr-field">
                        <label class="pr-label" for="prCount">题量</label>
                        <input id="prCount" class="pr-input pr-count" type="number" min="1" max="30" value="10">
                    </div>
                    <div class="pr-field pr-switches">
                        <label class="pr-check"><input type="checkbox" id="prAllowAi" checked> 题目不足时允许 AI 补题</label>
                        <label class="pr-check"><input type="checkbox" id="prVerifiedOnly" checked> 只取已人工校验的题库题</label>
                    </div>
                    <button id="prGenerateBtn" class="btn-upload pr-generate-btn">生成练习卷</button>
                    <div class="pr-status" id="prStatus"></div>
                </div>

                <div class="pr-notices" id="prNotices" hidden></div>

                <!-- 统计 -->
                <section class="pr-card" id="prStatsCard">
                    <div class="pr-card-head">
                        <h3>我的练习统计</h3>
                        <button class="pr-link-btn" id="prStatsRefresh">刷新统计</button>
                    </div>
                    <div class="pr-stats-body" id="prStats"></div>
                </section>

                <!-- 教师复习任务 -->
                <section class="pr-card" id="prTasksCard">
                    <div class="pr-card-head">
                        <h3>教师复习任务</h3>
                        <button class="pr-link-btn" id="prTasksRefresh">刷新任务</button>
                    </div>
                    <div class="pr-tasks-body" id="prTasks"></div>
                </section>

                <!-- 练习历史 -->
                <section class="pr-card" id="prHistoryCard">
                    <div class="pr-card-head">
                        <h3>练习题历史</h3>
                        <button class="pr-link-btn" id="prHistoryRefresh">刷新历史</button>
                    </div>
                    <div class="pr-history-body" id="prHistory"></div>
                </section>

                <!-- 试卷区 -->
                <section class="pr-paper-card" id="prPaperCard" hidden>
                    <div class="pr-paper-head">
                        <h2 id="prPaperTitle">练习卷</h2>
                        <p id="prPaperMeta"></p>
                    </div>
                    <div class="pr-notices" id="prPaperNotices" hidden></div>
                    <div class="pr-questions" id="prQuestions"></div>
                    <div class="pr-actions" id="prActions">
                        <button id="prSubmitBtn" class="btn-upload pr-action-btn">提交并判分</button>
                        <button id="prPrintBtn" class="btn-ghost">打印 / 导出 PDF</button>
                        <button id="prCloseBtn" class="btn-ghost">收起</button>
                    </div>
                    <div class="pr-summary" id="prSummary" hidden></div>
                    <div class="pr-wrongbook-actions" id="prWrongbookActions" hidden>
                        <button id="prWrongAllBtn" class="btn-upload pr-action-btn">把本次错题全部加入错题本</button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
            crossorigin="anonymous"></script>

    <script src="/static/js/practice.js"></script>
</body>

</html>
