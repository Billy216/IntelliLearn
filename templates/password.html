<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更改密码</title>
    <link rel="stylesheet" href="/static/css/password.css">
</head>

<body>
    <div class="bg-decoration"></div>

    <div class="container">
        <h1>更改密码</h1>
        <p class="subtitle">为了账户安全，请设置复杂密码</p>

        <form method="post" id="change_form" action="/change_passwd">
            <div class="form-group">
                <label for="username">
                    学号
                    <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required placeholder="请输入学号">
                </div>
            </div>

            <div class="form-group">
                <label for="new_password">
                    新密码
                    <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="new_password" name="new_password" required placeholder="请设置6~32位密码">
                    <button type="button" class="toggle-pwd" aria-label="切换密码显示"
                        onclick="togglePasswordVisibility('new_password', this)">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <div class="password-requirements" id="password-requirements">
                    <div class="requirement-item" id="req-length">
                        <span class="req-icon">✕</span> 至少8个字符
                    </div>
                    <div class="requirement-item" id="req-case">
                        <span class="req-icon">✕</span> 包含大小写字母
                    </div>
                    <div class="requirement-item" id="req-number">
                        <span class="req-icon">✕</span> 包含数字
                    </div>
                    <div class="requirement-item" id="req-special">
                        <span class="req-icon">✕</span> 包含特殊字符
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill"></div>
                    </div>
                    <div class="strength-label">请输入密码</div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    确认密码
                    <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" required
                        placeholder="请再次输入新密码">
                    <button type="button" class="toggle-pwd" aria-label="切换密码显示"
                        onclick="togglePasswordVisibility('confirm_password', this)">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="match-hint" id="match-hint">请再次输入新密码</div>
            </div>

            <div class="button-group">
                <button type="submit" id="submit-btn" disabled>确认修改</button>
                <button type="button" class="btn-secondary" onclick="window.location.href='{{ url_for('user_page') }}'">
                    <span class="btn-icon">↩</span>
                    返回个人页面
                </button>
            </div>
        </form>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/js/password.js"></script>
</body>

</html>
