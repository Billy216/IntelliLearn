<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的错题本 - IntelliLearn</title>
    <link rel="icon" href="/static/pic/logo.png">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="/static/css/errors_register.css">
    <link rel="stylesheet" href="/static/css/errors-book.css">
    <link rel="stylesheet" href="/static/css/render.css">
</head>

<body>
    <div class="main">
        <div class="top_nav">
            <a href="/home">
                <div class="logo">
                    <img src="/static/pic/logo.png" alt="">
                    <span>IntelliLearn</span>
                </div>
            </a>
            <nav>
                <img src="{{ avatar_path }}" alt="" class="img">
                <a href="/user" class="nav-link">{{ real_name }}</a>
                <span class="role-badge">{{ role_name }}</span>
            </nav>
        </div>

        <div class="container">
            <div class="lf_nav">
                <a href="/chat">
                    <div class="nav_item">
                        <span class="nav-emoji">💬</span>
                        AI回答
                    </div>
                </a>
                <a href="/exam">
                    <div class="nav_item">
                        <span class="nav-emoji">📋</span>
                        试卷生成
                    </div>
                </a>
                <a href="/errors_register">
                    <div class="active_lf">
                        <span class="nav-emoji">📒</span>
                        错题集
                    </div>
                </a>
                <a href="/practice">
                    <div class="nav_item">
                        <span class="nav-emoji">✍️</span>
                        练习复习
                    </div>
                </a>
                <a href="/resources">
                    <div class="nav_item">
                        <span class="nav-emoji">📚</span>
                        学习资源
                    </div>
                </a>
                {% if role in ['teacher', 'admin'] %}
                <a href="/teacher">
                    <div class="nav_item">
                        <span class="nav-emoji">🎓</span>
                        教师工作台
                    </div>
                </a>
                {% endif %}
                {% if role == 'admin' %}
                <a href="/admin">
                    <div class="nav_item">
                        <span class="nav-emoji">⚙️</span>
                        系统管理
                    </div>
                </a>
                {% endif %}
            </div>

            <div class="content">
                <!-- 筛选与搜索：全部条件都提交到后端查询，不做前端假筛选 -->
                <div class="book-toolbar">
                    <input type="text" id="keywordInput" class="book-search"
                           placeholder="搜索题目、解答或错因关键词…" autocomplete="off">

                    <select id="majorSelect" class="filter-select">
                        <option value="">全部学科</option>
                    </select>

                    <select id="errorTypeSelect" class="filter-select">
                        <option value="">全部错误类型</option>
                    </select>

                    <select id="masterySelect" class="filter-select">
                        <option value="">全部掌握度</option>
                        <option value="0">未掌握</option>
                        <option value="1">模糊</option>
                        <option value="2">已掌握</option>
                    </select>

                    <button type="button" id="searchBtn" class="book-btn primary">查询</button>
                    <button type="button" id="resetBtn" class="book-btn">重置</button>
                    <a href="/practice" class="book-btn link">用错题生成练习 →</a>
                </div>

                <!-- 统计概览（数据来自 /api/wrong_questions/stats） -->
                <div class="book-stats" id="statsPanel"></div>

                <div class="subject-title" id="subjectTitle">
                    <span id="subjectName">错题列表</span>
                    <span class="question-count" id="questionCount"></span>
                </div>

                <div class="questions-container" id="questionsContainer"></div>

                <div class="loading-indicator" id="loadingIndicator" style="display:none;">
                    <div class="spinner"></div>
                    <span>正在加载…</span>
                </div>

                <!-- 真实分页控件 -->
                <div class="book-pager" id="pager" style="display:none;">
                    <button type="button" id="prevPageBtn" class="book-btn">上一页</button>
                    <span id="pageInfo" class="page-info"></span>
                    <button type="button" id="nextPageBtn" class="book-btn">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-tags" id="modalTags"></div>
            <div class="modal-question" id="modalQuestion"></div>

            <div class="modal-answer-section" id="studentAnswerSection" style="display:none;">
                <h4>📝 你的作答</h4>
                <div class="modal-answer il-content" id="modalStudentAnswer"></div>
            </div>

            <div class="modal-answer-section">
                <h4>💡 解题过程与解析</h4>
                <div class="modal-answer il-content" id="modalAnswer"></div>
            </div>

            <div class="modal-answer-section" id="errorAnalysisSection" style="display:none;">
                <h4>⚠️ 错因分析</h4>
                <div class="modal-answer il-content" id="modalErrorAnalysis"></div>
            </div>

            <!-- 修正分类（真实 PATCH 请求） -->
            <div class="modal-edit">
                <h4>✏️ 修正分类</h4>
                <div class="edit-row">
                    <select id="editMajor" class="filter-select"></select>
                    <select id="editErrorType" class="filter-select">
                        <option value="">（不设置错误类型）</option>
                    </select>
                    <select id="editMastery" class="filter-select">
                        <option value="0">未掌握</option>
                        <option value="1">模糊</option>
                        <option value="2">已掌握</option>
                    </select>
                </div>
                <div class="edit-row">
                    <input type="text" id="editKp" class="book-search"
                           placeholder="知识点，多个用顿号分隔，例如：格林公式、曲线积分">
                </div>
                <div class="edit-row">
                    <button type="button" id="saveEditBtn" class="book-btn primary">保存修改</button>
                    <button type="button" id="reviewBtn" class="book-btn">标记为已复习</button>
                    <button type="button" id="deleteBtn" class="book-btn danger">删除该错题</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="/static/js/render.js"></script>
    <script src="/static/js/errors_register.js"></script>
</body>

</html>
